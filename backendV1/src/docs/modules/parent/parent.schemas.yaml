components:
  schemas:
    Parent_CreateRequest:
      type: object
      required:
        - studentId
        - parentName
        - phone
        - relationship
        - email
        - parentOtp
      properties:
        studentId:
          type: string
          description: Unique identifier of the student.
          example: "e9b5f4d3-1a2c-4b5d-9c8e-7f6a5b4c3d2e"
        parentName:
          type: string
          description: Full name of the parent/guardian.
          example: "John Doe"
        phone:
          type: string
          description: Contact phone number.
          example: "+919876543210"
        relationship:
          type: string
          description: Relationship to the student (e.g., Father, Mother, Guardian).
          example: "Father"
        email:
          type: string
          format: email
          description: Email address for OTP verification.
          example: "johndoe@example.com"
        parentOtp:
          type: string
          description: The 6-digit OTP sent to the parent's email.
          example: "123456"

    Parent_ConflictResolveRequest:
      type: object
      required:
        - studentId
        - parentName
        - phone
        - relationship
        - email
        - resolutionAction
      properties:
        studentId:
          type: string
          description: Unique identifier of the student.
          example: "e9b5f4d3-1a2c-4b5d-9c8e-7f6a5b4c3d2e"
        parentName:
          type: string
          example: "John Doe"
        phone:
          type: string
          example: "+919876543210"
        relationship:
          type: string
          example: "Father"
        email:
          type: string
          format: email
          example: "johndoe@example.com"
        resolutionAction:
          type: string
          enum: ["use_existing", "update_existing"]
          description: Action to take when a conflict is detected.
          example: "update_existing"

    Parent_Response:
      type: object
      properties:
        data:
          type: object
          properties:
            parentId:
              type: string
              example: "64f1b2c3d4e5f6a7b8c9d0e1"
            studentId:
              type: string
              example: "e9b5f4d3-1a2c-4b5d-9c8e-7f6a5b4c3d2e"
            parentName:
              type: string
              example: "John Doe"
            email:
              type: string
              example: "johndoe@example.com"
            defaultGuardian:
              type: boolean
              example: true
