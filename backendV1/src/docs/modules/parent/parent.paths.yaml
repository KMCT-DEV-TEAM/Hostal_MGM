paths:
  /parents:
    post:
      tags:
        - Parents
      summary: Create a new parent/guardian
      description: Creates a new parent record and links it to the specified student. Requires OTP verification.
      operationId: createParent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parent_CreateRequest'
      responses:
        '201':
          description: Parent created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent_Response'
        '400':
          description: Validation error or invalid OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ValidationErrorResponse'
        '409':
          description: Parent already linked or exists with different data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ConflictErrorResponse'

  /parents/resolve-conflict:
    post:
      tags:
        - Parents
      summary: Resolve a parent creation conflict
      description: Resolves a conflict when attempting to create a parent that already exists with different data or is already linked.
      operationId: resolveParentConflict
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parent_ConflictResolveRequest'
      responses:
        '201':
          description: Conflict resolved and parent linked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent_Response'
        '400':
          description: Validation error or invalid resolution action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ValidationErrorResponse'
        '409':
          description: Parent is already linked to the student.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ConflictErrorResponse'

  /parents/{id}:
    put:
      tags:
        - Parents
      summary: Update parent profile
      description: Updates parent details. If email is provided, it checks for uniqueness.
      operationId: updateParent
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The parent's unique ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parent_UpdateRequest'
      responses:
        '200':
          description: Parent updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent_Response'
        '400':
          description: Validation error or email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ValidationErrorResponse'
        '403':
          description: Unauthorized to access this parent profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'
        '404':
          description: Parent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'

  /parents/{id}/change-email:
    patch:
      tags:
        - Parents
      summary: Change parent email
      description: Changes a parent's email address and verifies it via OTP.
      operationId: changeParentEmail
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The parent's unique ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parent_ChangeEmailRequest'
      responses:
        '200':
          description: Parent email updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent_Response'
        '400':
          description: Validation error, email already exists, or invalid OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ValidationErrorResponse'
        '403':
          description: Unauthorized to access this parent profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'
        '404':
          description: Parent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'

  /parents/{id}/toggle-status:
    patch:
      tags:
        - Parents
      summary: Toggle parent status
      description: Activates or deactivates a parent account.
      operationId: toggleParentStatus
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The parent's unique ID
      responses:
        '200':
          description: Parent status updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Parent activated successfully"
                  data:
                    type: object
                    properties:
                      parentId:
                        type: string
                        example: "e9b5f4d3-1a2c-4b5d-9c8e-7f6a5b4c3d2e"
                      isActive:
                        type: boolean
                        example: true
        '403':
          description: Unauthorized to access this parent profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'
        '404':
          description: Parent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'

  /parents/{id}/default-guardian:
    patch:
      tags:
        - Parents
      summary: Set or remove parent as default guardian
      description: Sets or removes the parent as the default guardian for a student. A student must have at least one default guardian.
      operationId: setDefaultGuardian
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The parent's unique ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - defaultGuardian
              properties:
                defaultGuardian:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Default guardian status updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Parent set as default guardian successfully"
                  data:
                    type: object
                    properties:
                      parentId:
                        type: string
                        example: "e9b5f4d3-1a2c-4b5d-9c8e-7f6a5b4c3d2e"
                      defaultGuardian:
                        type: boolean
                        example: true
        '400':
          description: Validation error or business rule violation (e.g. removing the only default guardian).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'
        '403':
          description: Unauthorized to access this parent profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'
        '404':
          description: Parent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'

  /parents/admin:
    get:
      tags:
        - Parents
      summary: Get parents (Admin)
      description: Fetches a paginated list of parents for the admin's organization. Supports search and filtering.
      operationId: getParentsByAdmin
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of records per page
        - in: query
          name: search
          schema:
            type: string
          description: Search term for parent name, email, phone, relationship, student name, student email, or admissionNo
        - in: query
          name: relationship
          schema:
            type: string
          description: Filter by relationship (e.g., father, mother, guardian, other)
        - in: query
          name: defaultGuardian
          schema:
            type: boolean
          description: Filter by default guardian status
        - in: query
          name: isActive
          schema:
            type: boolean
          description: Filter by parent active status
      responses:
        '200':
          description: Parents fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent_ListResponse'

  /parents/super-admin:
    get:
      tags:
        - Parents
      summary: Get parents (Super Admin)
      description: Fetches a paginated list of parents. Supports search and filtering by organizationId.
      operationId: getParentsBySuperAdmin
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: organizationId
          schema:
            type: string
          description: Filter by organization ID
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: relationship
          schema:
            type: string
        - in: query
          name: defaultGuardian
          schema:
            type: boolean
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        '200':
          description: Parents fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent_ListResponse'

  /parents/warden:
    get:
      tags:
        - Parents
      summary: Get parents (Warden)
      description: Fetches parents of students currently residing in hostels managed by the warden. Only returns active parents.
      operationId: getParentsByWarden
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: relationship
          schema:
            type: string
        - in: query
          name: defaultGuardian
          schema:
            type: boolean
      responses:
        '200':
          description: Parents fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent_ListResponse'

  /parents/mentor:
    get:
      tags:
        - Parents
      summary: Get parents (Mentor)
      description: Fetches parents of students belonging to batches mentored by the user. Only returns active parents.
      operationId: getParentsByMentor
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: relationship
          schema:
            type: string
        - in: query
          name: defaultGuardian
          schema:
            type: boolean
      responses:
        '200':
          description: Parents fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent_ListResponse'

  /parents/export/admin:
    get:
      tags:
        - Parents
      summary: Export parents (Admin)
      description: Exports the parent list for the admin's organization. Supports search and filtering.
      operationId: exportParentsByAdmin
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search term for parent name, email, phone, relationship, student name, student email, or admissionNo
        - in: query
          name: relationship
          schema:
            type: string
          description: Filter by relationship (e.g., father, mother, guardian, other)
        - in: query
          name: defaultGuardian
          schema:
            type: boolean
          description: Filter by default guardian status
        - in: query
          name: isActive
          schema:
            type: boolean
          description: Filter by parent active status
      responses:
        '200':
          description: Parents exported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      parents:
                        type: array
                        items:
                          $ref: '#/components/schemas/Parent_ListResponse/properties/data/properties/parents/items'

  /parents/export/super-admin:
    get:
      tags:
        - Parents
      summary: Export parents (Super Admin)
      description: Exports parent data globally or by organization. Supports search and filtering.
      operationId: exportParentsBySuperAdmin
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: organizationId
          schema:
            type: string
          description: Filter by organization ID
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: relationship
          schema:
            type: string
        - in: query
          name: defaultGuardian
          schema:
            type: boolean
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        '200':
          description: Parents exported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      parents:
                        type: array
                        items:
                          $ref: '#/components/schemas/Parent_ListResponse/properties/data/properties/parents/items'
