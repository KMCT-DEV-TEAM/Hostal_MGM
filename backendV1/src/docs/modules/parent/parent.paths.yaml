paths:
  /parents:
    post:
      tags:
        - Parents
      summary: Create a new parent/guardian
      description: Creates a new parent record and links it to the specified student. Requires OTP verification.
      operationId: createParent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parent_CreateRequest'
      responses:
        '201':
          description: Parent created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent_Response'
        '400':
          description: Validation error or invalid OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ValidationErrorResponse'
        '409':
          description: Parent already linked or exists with different data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ConflictErrorResponse'

  /parents/resolve-conflict:
    post:
      tags:
        - Parents
      summary: Resolve a parent creation conflict
      description: Resolves a conflict when attempting to create a parent that already exists with different data or is already linked.
      operationId: resolveParentConflict
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parent_ConflictResolveRequest'
      responses:
        '201':
          description: Conflict resolved and parent linked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent_Response'
        '400':
          description: Validation error or invalid resolution action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ValidationErrorResponse'
        '409':
          description: Parent is already linked to the student.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ConflictErrorResponse'

  /parents/{id}:
    put:
      tags:
        - Parents
      summary: Update parent profile
      description: Updates parent details. If email is provided, it checks for uniqueness.
      operationId: updateParent
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The parent's unique ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parent_UpdateRequest'
      responses:
        '200':
          description: Parent updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent_Response'
        '400':
          description: Validation error or email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ValidationErrorResponse'
        '403':
          description: Unauthorized to access this parent profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'
        '404':
          description: Parent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'

  /parents/{id}/change-email:
    patch:
      tags:
        - Parents
      summary: Change parent email
      description: Changes a parent's email address and verifies it via OTP.
      operationId: changeParentEmail
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The parent's unique ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parent_ChangeEmailRequest'
      responses:
        '200':
          description: Parent email updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent_Response'
        '400':
          description: Validation error, email already exists, or invalid OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ValidationErrorResponse'
        '403':
          description: Unauthorized to access this parent profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'
        '404':
          description: Parent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ErrorResponse'
