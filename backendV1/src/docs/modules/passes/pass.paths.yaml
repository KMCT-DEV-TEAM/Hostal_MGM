paths:
  /passes:
    post:
      tags:
        - Passes
      summary: Create a new pass
      description: Creates a new pass request (Home Pass or Out Pass) for the authenticated student.
      operationId: createPass
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pass_CreateRequest'
      responses:
        '201':
          description: Pass created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass_Response'
        '400':
          description: Validation error or missing details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ValidationErrorResponse'
        '404':
          description: Student account or default guardian not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_StandardErrorResponse'
    get:
      tags:
        - Passes
      summary: Get student passes (Unified)
      description: Retrieves a unified, paginated list of pass requests or history for the authenticated student. Includes summary statistics (total, approved, pending) and supports filtering by status, pass type, date range, and search terms.
      operationId: getMyPassesUnified
      security:
        - BearerAuth: []
      parameters:
        - name: studentId
          in: query
          description: Required for Parents. The ID of the student to fetch passes for.
          required: false
          schema:
            type: string
        - name: mode
          in: query
          description: Defines the status buckets. Use "requests" for active passes, or "history" for past/completed passes. Overridden if 'status' is explicitly provided.
          required: false
          schema:
            type: string
            enum: [requests, history]
            default: requests
        - name: status
          in: query
          description: Explicitly filter by a specific pass status.
          required: false
          schema:
            type: string
            enum: [pending_parent, pending_admin, approved, rejected, cancelled, returned, completed]
        - name: passType
          in: query
          description: Filter by pass type.
          required: false
          schema:
            type: string
            enum: [home_pass, out_pass]
        - name: category
          in: query
          description: Filter by out pass category.
          required: false
          schema:
            type: string
            enum: [in_house, out_house]
        - name: fromDate
          in: query
          description: Filter passes starting from this date (YYYY-MM-DD).
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          description: Filter passes up to this date (YYYY-MM-DD).
          required: false
          schema:
            type: string
            format: date
        - name: search
          in: query
          description: Search term to match against the pass reason.
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          description: Field to sort by.
          required: false
          schema:
            type: string
            enum: [createdAt, fromDate, date]
            default: createdAt
        - name: sortOrder
          in: query
          description: Sort direction.
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          description: Page number for pagination.
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page.
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Passes loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass_UnifiedListingResponse'
        '400':
          description: Validation error in query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ValidationErrorResponse'
  /passes/parent-list:
    get:
      tags:
        - Passes
      summary: Get parent passes (Legacy)
      description: Retrieves a paginated list of pass requests for a parent (Legacy listing).
      operationId: getPasses
      security:
        - BearerAuth: []
      parameters:
        - name: studentId
          in: query
          description: The ID of the student.
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Explicitly filter by a specific pass status.
          required: false
          schema:
            type: string
            enum: [pending_parent, pending_admin, approved, rejected, cancelled, returned, completed]
        - name: passType
          in: query
          description: Filter by pass type.
          required: false
          schema:
            type: string
            enum: [home_pass, out_pass]
        - name: category
          in: query
          description: Filter by out pass category.
          required: false
          schema:
            type: string
            enum: [in_house, out_house]
        - name: page
          in: query
          description: Page number for pagination.
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page.
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Passes loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass_ListResponse'
  /passes/dashboard:
    get:
      tags:
        - Passes
      summary: Get pass dashboard statistics (Unified)
      description: Retrieves the pass dashboard statistics for the authenticated mentor, admin, or super_admin. The response structure varies depending on the role of the authenticated user. Mentors receive a comprehensive dashboard payload including attendance and complaints. Admins and Super Admins receive primarily pass statistics, with Super Admins getting additional organizational counts.
      operationId: getManagementDashboardStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dashboard statistics loaded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
        '403':
          description: Access denied.
  /passes/hostels:
    get:
      tags:
        - Passes
      summary: Get management hostels (Unified)
      description: Retrieves a paginated list of hostels managed by the authenticated mentor, admin, or super_admin.
      operationId: getManagementHostels
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          description: Search term to match against the hostel name.
          required: false
          schema:
            type: string
        - name: passType
          in: query
          description: Filter statistics by pass type.
          required: false
          schema:
            type: string
            enum: [all, home_pass, out_pass]
            default: all
        - name: page
          in: query
          description: Page number for pagination.
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page.
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Hostels loaded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                      pagination:
                        type: object
  /passes/hostels/{hostelId}/passes:
    get:
      tags:
        - Passes
      summary: Get management hostel passes (Unified)
      description: Retrieves passes for a specific hostel managed by the authenticated mentor, admin, or super_admin.
      operationId: getManagementHostelPasses
      security:
        - BearerAuth: []
      parameters:
        - name: hostelId
          in: path
          description: The unique UUID of the hostel.
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by pass status.
          required: false
          schema:
            type: string
            enum: [pending_parent, pending_admin, approved, rejected, cancelled, returned, completed]
        - name: passType
          in: query
          description: Filter by pass type.
          required: false
          schema:
            type: string
            enum: [all, home_pass, out_pass]
            default: all
        - name: category
          in: query
          description: Filter by out pass category.
          required: false
          schema:
            type: string
            enum: [all, in_house, out_house]
            default: all
        - name: search
          in: query
          description: Search term to match against the student name.
          required: false
          schema:
            type: string
        - name: fromDate
          in: query
          description: Filter passes starting from this date (YYYY-MM-DD).
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          description: Filter passes up to this date (YYYY-MM-DD).
          required: false
          schema:
            type: string
            format: date
        - name: sortBy
          in: query
          description: Field to sort by.
          required: false
          schema:
            type: string
            enum: [createdAt, fromDate]
            default: createdAt
        - name: sortOrder
          in: query
          description: Sort direction.
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          description: Page number for pagination.
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page.
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Passes loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass_UnifiedListingResponse'
        '400':
          description: Validation error.
        '403':
          description: Access denied or forbidden.

  /passes/{id}:
    get:
      tags:
        - Passes
      summary: Get pass details
      description: Retrieves the detailed information of a specific pass by its ID. Enforces organization-level tenant isolation and role-specific permissions for students, parents, wardens, assistant wardens, mentors, admins, and super admins.
      operationId: getPassDetails
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: The unique UUID of the pass.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pass details loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass_Response'
        '400':
          description: Invalid Pass ID format (must be UUID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_ValidationErrorResponse'
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_StandardErrorResponse'
        '404':
          description: Pass not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_StandardErrorResponse'
    put:
      tags:
        - Passes
      summary: Update a pass request (Student/Parent)
      description: Allows a student or parent to update an existing pass request. Support editing reason, dates, times, or category. Enforces ownership and status transitions.
      operationId: updatePass
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: The unique UUID of the pass.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                fromDate:
                  type: string
                  format: date-time
                toDate:
                  type: string
                  format: date-time
                date:
                  type: string
                  format: date
                outTime:
                  type: string
                  pattern: '^\d{2}:\d{2}$'
                expectedReturnTime:
                  type: string
                  pattern: '^\d{2}:\d{2}$'
                outPassCategory:
                  type: string
                  enum: [in_house, out_house]
      responses:
        '200':
          description: Pass updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass_Response'
        '400':
          description: Validation error or invalid update details.
        '403':
          description: Forbidden. Insufficient permissions.
        '404':
          description: Pass not found.
        '422':
          description: Unprocessable. Pass cannot be edited.
  /passes/{id}/cancel:
    put:
      tags:
        - Passes
      summary: Cancel a pass request (All Roles)
      description: Cancels an active pass request. Supported roles include student, parent, mentor, admin, and super_admin.
      operationId: cancelPass
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: The unique UUID of the pass.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                remarks:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Pass cancelled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass_Response'
        '400':
          description: Validation error.
        '403':
          description: Forbidden. Insufficient permissions.
        '404':
          description: Pass not found.
        '422':
          description: Unprocessable. Pass cannot be cancelled.
  /passes/{id}/approve:
    patch:
      tags:
        - Passes
      summary: Approve a pass request (Parent/Mentor/Admin)
      description: Approves a pass request. Authenticated user's role (parent, mentor, admin, super_admin) determines the specific approval rules, status transitions, notifications, and timeline actions executed.
      operationId: approvePass
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: The unique UUID of the pass.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                remarks:
                  type: string
                  description: Optional remarks or reason for approval.
      responses:
        '200':
          description: Pass approved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass_Response'
        '400':
          description: Validation error or pass not waiting for this approval.
        '403':
          description: Forbidden. Insufficient permissions or not linked.
        '404':
          description: Pass not found.
        '409':
          description: Conflict. Pass status changed concurrently.
        '422':
          description: Unprocessable. The pass cannot be approved in its current status.
