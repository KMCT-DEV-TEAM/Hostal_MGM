components:
  schemas:
    Pass_CreateRequest:
      type: object
      required:
        - passType
        - reason
      properties:
        passType:
          type: string
          enum: [home_pass, out_pass]
          description: Type of the pass requested.
          example: "home_pass"
        reason:
          type: string
          description: Reason for the leave or pass.
          example: "Going home for the weekend"
        fromDate:
          type: string
          format: date
          description: Start date of the leave (Required if passType is home_pass).
          example: "2026-08-25"
        toDate:
          type: string
          format: date
          description: End date of the leave (Required if passType is home_pass).
          example: "2026-08-27"
        totalDays:
          type: integer
          description: Total number of days for the leave (Required if passType is home_pass).
          example: 3
        date:
          type: string
          format: date
          description: Date for the out pass (Required if passType is out_pass).
          example: "2026-08-22"
        outTime:
          type: string
          description: Departure time in HH:mm format (Required if passType is out_pass).
          example: "14:00"
        expectedReturnTime:
          type: string
          description: Expected return time in HH:mm format (Required if passType is out_pass).
          example: "18:00"
        outPassCategory:
          type: string
          enum: [in_house, out_house]
          description: Category of the out pass (Required if passType is out_pass).
          example: "out_house"

    Pass_Response:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Pass created successfully"
        data:
          type: object
          properties:
            id:
              type: string
              example: "64fc8b9f1a2c3d4e5f6g7h8i"
            studentId:
              type: string
              example: "64fc8b9f1a2c3d4e5f6g7h8j"
            hostelId:
              type: string
              example: "64fc8b9f1a2c3d4e5f6g7h8k"
            parentId:
              type: string
              example: "64fc8b9f1a2c3d4e5f6g7h8l"
            passType:
              type: string
              example: "home_pass"
            reason:
              type: string
              example: "Going home for the weekend"
            status:
              type: string
              example: "pending_parent"
            fromDate:
              type: string
              format: date
              example: "2026-08-25"
            toDate:
              type: string
              format: date
              example: "2026-08-27"
            totalDays:
              type: integer
              example: 3
            timeline:
              type: array
              items:
                type: object
                properties:
                  action:
                    type: string
                    example: "created"
                  actorId:
                    type: string
                    example: "64fc8b9f1a2c3d4e5f6g7h8j"
                  actorRole:
                    type: string
                    example: "student"
                  remarks:
                    type: string
                    example: "Pass request submitted."
                  timestamp:
                    type: string
                    format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
